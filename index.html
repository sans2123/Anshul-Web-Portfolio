  <!-- Loader. Inlined on purpose: it must paint before styles.css/React/Babel
       arrive, so it costs one paint and zero extra requests. -->
  <style>
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: #ECEDF1;
      opacity: 1;
      transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      /* own layer, so the fade is a compositor-only job and never relayouts
         or repaints the page that is booting up behind it */
      will-change: opacity;
      transform: translateZ(0);
      backface-visibility: hidden;
      contain: strict;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    /* stop the looping animations the instant the fade starts — they compete
       with the page's own first frames (shader compile, lava layout, reveals) */
    #boot.done #boot-panel,
    #boot.done #boot-mark i,
    #boot.done #boot-mark b,
    #boot.done #boot-text { animation: none !important; }
    #boot-panel {
      display: flex; flex-direction: column; align-items: center; gap: 22px;
      padding: 40px 46px 34px;
      transform: translateY(6px) scale(0.985);
      opacity: 0;
      animation: bootIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
    }
    @keyframes bootIn { to { transform: none; opacity: 1; } }

    #boot-mark {
      display: flex; align-items: center; gap: 10px;
      font-family: "Bricolage Grotesque", "Chivo", sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      line-height: 1;
      letter-spacing: -0.032em;
      color: #131317;
    }
    #boot-mark i {
      width: 8px; height: 8px; border-radius: 50%;
      background: #131317;
      animation: bootPulse 1.6s ease-in-out infinite;
    }
    #boot-mark b { display: block; animation: bootSpin 3.4s linear infinite; font-weight: 800; }
    @keyframes bootPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.8); } }
    @keyframes bootSpin { to { transform: rotate(360deg); } }

    #boot-text {
      font-family: "JetBrains Mono", monospace;
      text-transform: uppercase;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: #7C7D86;
      background: linear-gradient(100deg, #7C7D86 34%, #131317 50%, #7C7D86 66%);
      background-size: 260% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: bootShimmer 2.4s linear infinite;
    }
    @keyframes bootShimmer { from { background-position: 130% 0; } to { background-position: -130% 0; } }

    #boot-bar {
      width: 180px; height: 2px; border-radius: 2px;
      background: rgba(19,19,23,0.12);
      overflow: hidden;
    }
    #boot-bar span {
      display: block; height: 100%; width: 8%;
      border-radius: 2px;
      background: #131317;
      transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      #boot-panel { animation: none; transform: none; opacity: 1; }
      #boot-mark i, #boot-mark b, #boot-text { animation: none; }
      #boot-text { -webkit-text-fill-color: #7C7D86; }
      #boot-bar span { transition-duration: 0.2s; }
    }
  </style>
</head>
<body style="background-color: #ECEDF1">
  <div id="boot" role="status" aria-live="polite">
    <div id="boot-panel">
      <div id="boot-mark"><i></i><b>&#10033;</b></div>
      <div id="boot-text">Getting things ready</div>
      <div id="boot-bar"><span></span></div>
    </div>
  </div>

  <div id="root"></div>

  <script>
  /* Dismiss on real readiness — fonts, first React paint, window load — not a timer.
     The bar reflects those milestones; the 8s cap only exists so a stalled
     third-party script can never trap the page behind the loader. */
  (function () {
    var el = document.getElementById('boot');
    if (!el) return;
    var fill = el.querySelector('#boot-bar span');
    var at = 8, hit = { fonts: 0, mount: 0, load: 0 }, closed = 0;

    function to(p) { at = Math.max(at, p); fill.style.width = at + '%'; }
    function mark(k, p) {
      if (hit[k]) return;
      hit[k] = 1; to(p);
      if (hit.mount && hit.load) close();
    }
    /* The page's heaviest frames land exactly at handoff: WebGL compile, lava
       layout, reveal observers. Fading through them is what stuttered, so wait
       for the main thread to actually settle (two cheap frames in a row) before
       starting the fade, and hand over on a frame boundary.
       Every wait here is raced against a timer: rAF is suspended in background
       tabs, and a loader that can only dismiss on a visible frame would sit on
       top of a finished page until the visitor focuses it. */
    function settle(done) {
      if (document.hidden) return done();
      var fired = 0, fin = function () { if (!fired) { fired = 1; done(); } };
      var tries = 0, prev = performance.now(), calm = 0;
      setTimeout(fin, 1200);
      (function tick(now) {
        if (fired) return;
        var dt = now - prev; prev = now;
        calm = dt < 26 ? calm + 1 : 0;
        if (calm >= 2 || ++tries > 40) fin();
        else requestAnimationFrame(tick);
      })(prev);
    }
    function frame(fn) {
      var ran = 0, go = function () { if (!ran) { ran = 1; fn(); } };
      if (document.hidden) return go();
      requestAnimationFrame(go);
      setTimeout(go, 250);
    }
    function close() {
      if (closed) return;
      closed = 1; to(100);
      setTimeout(function () {
        settle(function () {
          frame(function () {
            el.classList.add('done');
            var gone = 0, fin = function () {
              if (gone) return; gone = 1; el.remove();
            };
            el.addEventListener('transitionend', fin, { once: true });
            setTimeout(fin, 900);
          });
        });
      }, 220);
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { mark('fonts', 42); });
    } else { mark('fonts', 42); }

    var root = document.getElementById('root');
    if (root.childElementCount) mark('mount', 76);
    else {
      var mo = new MutationObserver(function () {
        if (root.childElementCount) { mo.disconnect(); frame(function () { mark('mount', 76); }); }
      });
      mo.observe(root, { childList: true });
    }

    if (document.readyState === 'complete') mark('load', 88);
    else window.addEventListener('load', function () { mark('load', 88); });

    setTimeout(close, 8000);
  })();
  </script>
